<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — D'RANIK Techs Admin</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Dashboard</h1>
        <div class="topbar-user">
          <span id="user-email"></span>
          <div class="topbar-avatar" id="user-avatar">A</div>
        </div>
      </header>

      <main class="content">
        <div class="stat-grid" id="stat-grid">
          <!-- populated by dashboard.js -->
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/admin/js/dashboard.js"></script>
</body>
</html>
