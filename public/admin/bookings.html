<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookings — D'RANIK Techs Admin</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Bookings</h1>
        <div class="topbar-user">
          <span id="user-email"></span>
          <div class="topbar-avatar" id="user-avatar">A</div>
        </div>
      </header>

      <main class="content" style="max-width:1400px;">
        <div class="panel">
          <div class="toolbar">
            <input type="text" id="f-search" placeholder="Search reference, customer, or provider" />
            <select id="f-status">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="in_progress">In progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Reference</th>
                  <th>Service</th>
                  <th>Customer</th>
                  <th>Provider</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Payment</th>
                  <th>Scheduled</th>
                </tr>
              </thead>
              <tbody id="bookings-tbody"></tbody>
            </table>
          </div>
          <div id="empty-state"></div>
          <div class="pagination">
            <span id="page-info"></span>
            <div class="pager-btns">
              <button class="btn btn-outline btn-sm" id="prev-page">Previous</button>
              <button class="btn btn-outline btn-sm" id="next-page">Next</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="overlay" id="detail-overlay">
    <div class="modal" style="max-width:640px;">
      <div class="modal-header">
        <h3 id="detail-title">Booking</h3>
        <button class="modal-close" id="detail-close">&times;</button>
      </div>
      <div class="modal-body" id="detail-body"></div>
    </div>
  </div>

  <script type="module" src="/admin/js/bookings.js"></script>
</body>
</html>
