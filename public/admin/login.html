<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — D'RANIK Techs</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body class="login-page">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <div class="login-logo">DT</div>
      <h1>D'RANIK Techs</h1>
      <p>Trusted Services Anytime, Anywhere</p>
    </div>

    <div class="form-error" id="form-error"></div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
  </form>

  <script type="module">
    import { signIn, clearSession } from "/admin/js/auth.js";
    import { apiQuery } from "/admin/js/api.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("form-error");
    const submitBtn = document.getElementById("submit-btn");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("visible");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signIn(email, password);
        // Confirm this account actually has the admin role — signIn alone just
        // proves valid Supabase credentials, not admin access.
        await apiQuery("adminVerification.stats");
        window.location.href = "/admin/index.html";
      } catch (err) {
        let message = err.message || "Could not sign in. Please try again.";
        if (err.code === "FORBIDDEN") {
          message = "This account does not have admin access.";
          clearSession();
        }
        showError(message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
