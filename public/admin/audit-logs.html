<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audit Logs — D'RANIK Techs Admin</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="main">
      <header class="topbar">
        <h1>Audit Logs</h1>
        <div class="topbar-user">
          <span id="user-email"></span>
          <div class="topbar-avatar" id="user-avatar">A</div>
        </div>
      </header>

      <main class="content" style="max-width:1400px;">
        <div class="panel">
          <div class="toolbar">
            <select id="f-action">
              <option value="">All actions</option>
            </select>
            <input type="text" id="f-entity-type" placeholder="Entity type (e.g. booking, provider)" />
            <input type="date" id="f-from" />
            <input type="date" id="f-to" />
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>When</th>
                  <th>Admin</th>
                  <th>Action</th>
                  <th>Entity</th>
                  <th>Detail</th>
                </tr>
              </thead>
              <tbody id="logs-tbody"></tbody>
            </table>
          </div>
          <div id="empty-state"></div>
          <div class="pagination">
            <span id="page-info"></span>
            <div class="pager-btns">
              <button class="btn btn-outline btn-sm" id="prev-page">Previous</button>
              <button class="btn btn-outline btn-sm" id="next-page">Next</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/admin/js/audit-logs.js"></script>
</body>
</html>
